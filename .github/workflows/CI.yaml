name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: zuvaai/github-actions/setup-go@main
        with:
          go-version: "1.19.3"

      - name: Checkout
        uses: zuvaai/github-actions/checkout@main

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: zuvaai/github-actions/cache@main
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}-v2

      - name: Git LFS Pull
        run: git lfs pull

      - name: Go cache
        uses: zuvaai/github-actions/cache@main
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-gov2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gov2-

      - name: Install dependencies
        run: |
          sudo apt-get install make protobuf-compiler
          make .install-bin-deps
          go mod download

      - name: Run build
        run: make

      - name: Run testing
        run: make test
